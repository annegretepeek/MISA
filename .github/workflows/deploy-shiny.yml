name: Deploy Shiny app

on:
  schedule:
    - cron: "0 6 11 1,4,7,10 *" 
  workflow_dispatch:        # allows manual run

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::httr
            any::jsonlite
            
      - name: Install R packages
        run: |
            install.packages(c(
                "rsconnect",
                "httr",
                "jsonlite",
                "arrow",
                "dplyr",
                "ggplot2",
                "htmltools",
                "lubridate",
                "plotly",
                "readxl",
                "shiny",
                "shinycssloaders",
                "shinyjs",
                "shinyWidgets",
                "stringr",
                "tidyverse",
                "zoo"
            ), repos = "https://cloud.r-project.org")

      - name: Rebuild data
        env:
          GITHUB_PAT: ${{ secrets.DATA_REPO_PAT  }}
        run: Rscript data_download.R
      
      - name: Check downloaded data
        run: |
            find data -type f | head
            du -sh data

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          ); rsconnect::deployApp(
            appDir = ".",
            appFiles = c("ui.R", "server.R", "global.R", "www", "data"),
            forceUpdate = TRUE
          )'