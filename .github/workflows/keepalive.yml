name: Keep repository active

on:
  schedule:
    - cron: '17 3 * * 1' # Every Monday at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit after 30 days of inactivity
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - last_commit < 30 * 24 * 60 * 60 )); then
            echo "The repository has a recent commit; no keepalive needed."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled workflows active'
          git push origin HEAD
